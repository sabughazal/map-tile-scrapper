<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Auto Tile Downloader</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css">
	<link rel="stylesheet" href="/static/css/auto.css">
	<link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
</head>
<body>
	<div id="map" aria-label="Map"></div>

	<nav class="page-nav" aria-label="Page navigation">
		<a class="page-link" href="/">Map Preview</a>
		<a class="page-link current" href="/auto">Auto Downloader</a>
		<a class="page-link" href="/geotiff">GeoTIFF Export</a>
	</nav>
	<aside class="side-panel">
		<h1>Auto Tile Downloader</h1>
		<p class="muted">Draw a rectangle and choose zoom levels to prefetch tiles into cache.</p>

		<section class="tool-row">
			<button id="drawBtn" type="button">Draw Rectangle</button>
			<button id="clearBtn" type="button" class="secondary">Clear</button>
		</section>

		<section class="extent-box">
			<h2>Selected Extent</h2>
			<pre id="extentText">No area selected</pre>
		</section>

		<section class="zoom-box">
			<div class="section-head">
				<h2>Zoom Levels</h2>
				<div class="quick-actions">
					<button id="selectAllZoom" type="button" class="secondary small">All</button>
					<button id="clearZoom" type="button" class="secondary small">None</button>
				</div>
			</div>
			<div id="zoomList" class="zoom-list"></div>
		</section>

		<section class="backoff-box">
			<h2>404 Backoff</h2>
			<label class="backoff-toggle">
				<input id="backoffEnabled" type="checkbox" checked>
				<span>Slow down on too many 404 responses</span>
			</label>
			<div class="backoff-grid">
				<label>
					<span>Window</span>
					<input id="backoffWindow" type="number" min="10" max="200" value="40">
				</label>
				<label>
					<span>404 trigger</span>
					<input id="backoffThreshold" type="number" min="1" max="200" value="10">
				</label>
				<label>
					<span>Step (ms)</span>
					<input id="backoffStep" type="number" min="50" max="5000" value="250">
				</label>
				<label>
					<span>Max delay (ms)</span>
					<input id="backoffMax" type="number" min="100" max="15000" value="2000">
				</label>
			</div>
			<p class="muted backoff-status">Current delay: <strong id="backoffStatus">0ms</strong></p>
		</section>

		<section class="tool-row job-controls">
			<button id="downloadBtn" type="button">Start Download</button>
			<button id="pauseBtn" type="button" class="secondary" disabled>Pause</button>
			<button id="cancelBtn" type="button" class="secondary" disabled>Cancel</button>
		</section>

		<section class="progress-box">
			<div class="section-head">
				<h2>Progress</h2>
				<span id="stateLabel" class="state-label">Idle</span>
			</div>
			<div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
			<p class="muted"><strong id="progressText">0 / 0</strong> tiles &middot; <span id="failedText">0 failed</span></p>
		</section>

		<section class="responses-box">
			<h2>Activity Log</h2>
			<pre id="responsesText">No requests yet</pre>
		</section>
	</aside>

	<script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>
	<script>
		const MAX_ZOOM = 21;
		const MIN_ZOOM = 2;
		const LIST_MIN_ZOOM = 0;

		const ui = {
			drawBtn: document.getElementById("drawBtn"),
			clearBtn: document.getElementById("clearBtn"),
			downloadBtn: document.getElementById("downloadBtn"),
			pauseBtn: document.getElementById("pauseBtn"),
			cancelBtn: document.getElementById("cancelBtn"),
			stateLabel: document.getElementById("stateLabel"),
			progressFill: document.getElementById("progressFill"),
			progressText: document.getElementById("progressText"),
			failedText: document.getElementById("failedText"),
			backoffEnabled: document.getElementById("backoffEnabled"),
			backoffWindow: document.getElementById("backoffWindow"),
			backoffThreshold: document.getElementById("backoffThreshold"),
			backoffStep: document.getElementById("backoffStep"),
			backoffMax: document.getElementById("backoffMax"),
			backoffStatus: document.getElementById("backoffStatus"),
			selectAllZoom: document.getElementById("selectAllZoom"),
			clearZoom: document.getElementById("clearZoom"),
			zoomList: document.getElementById("zoomList"),
			extentText: document.getElementById("extentText"),
			responsesText: document.getElementById("responsesText")
		};

		const drawSource = new ol.source.Vector();
		const drawLayer = new ol.layer.Vector({
			source: drawSource,
			style: new ol.style.Style({
				stroke: new ol.style.Stroke({ color: "#fbbf24", width: 2 }),
				fill: new ol.style.Fill({ color: "rgba(251, 191, 36, 0.15)" })
			})
		});

		const drawInteraction = new ol.interaction.Draw({
			source: drawSource,
			type: "Circle",
			geometryFunction: ol.interaction.Draw.createBox()
		});
		drawInteraction.setActive(false);

		const map = new ol.Map({
			target: "map",
			controls: ol.control.defaults.defaults({
				zoom: false
			}),
			layers: [
				new ol.layer.Tile({
					source: new ol.source.XYZ({
						url: "/scrapper/{z}/{x}/{y}",
						maxZoom: MAX_ZOOM
					})
				}),
				drawLayer
			],
			view: new ol.View({
				center: ol.proj.fromLonLat([54, 24]),
				zoom: 8,
				minZoom: MIN_ZOOM,
				maxZoom: MAX_ZOOM
			})
		});
		map.addInteraction(drawInteraction);

		let selectedGeometry = null;

		function appendResponse(message) {
			if (ui.responsesText.textContent === "No requests yet") {
				ui.responsesText.textContent = message;
				ui.responsesText.scrollTop = ui.responsesText.scrollHeight;
				return;
			}
			ui.responsesText.textContent += `\n${message}`;
			ui.responsesText.scrollTop = ui.responsesText.scrollHeight;
		}

		function getBackoffConfig() {
			return {
				enabled: ui.backoffEnabled.checked,
				window: Math.max(10, Number(ui.backoffWindow.value) || 40),
				threshold: Math.max(1, Number(ui.backoffThreshold.value) || 10),
				stepMs: Math.max(50, Number(ui.backoffStep.value) || 250),
				maxDelayMs: Math.max(100, Number(ui.backoffMax.value) || 2000)
			};
		}

		function renderBackoffStatus(delayMs) {
			ui.backoffStatus.textContent = `${delayMs}ms`;
		}

		function getSelectedExtent() {
			if (!selectedGeometry) {
				return null;
			}

			const [minX, minY, maxX, maxY] = selectedGeometry.getExtent();
			const lowerLeft = ol.proj.toLonLat([minX, minY]);
			const upperRight = ol.proj.toLonLat([maxX, maxY]);

			return {
				minX: lowerLeft[0],
				minY: lowerLeft[1],
				maxX: upperRight[0],
				maxY: upperRight[1]
			};
		}

		function getSelectedZoomLevels() {
			const checkboxes = ui.zoomList.querySelectorAll("input[type='checkbox']:checked");
			return Array.from(checkboxes).map((box) => Number(box.value));
		}

		const POLL_INTERVAL_MS = 500;
		let activeJob = null;
		let pollHandle = null;
		let pollBusy = false;

		function setState(label, cls) {
			ui.stateLabel.textContent = label;
			ui.stateLabel.className = `state-label ${cls || ""}`.trim();
		}

		function renderProgress(data) {
			const total = Number(data.total) || 0;
			const completed = Number(data.completed) || 0;
			const failed = Number(data.failed) || 0;
			const done = completed + failed;
			const pct = total ? Math.round((done / total) * 100) : 0;
			ui.progressFill.style.width = `${pct}%`;
			ui.progressText.textContent = `${done} / ${total}`;
			ui.failedText.textContent = `${failed} failed`;
		}

		function applyEvents(events) {
			for (const event of events || []) {
				if (event.type === "backoff") {
					renderBackoffStatus(event.delay_ms);
					appendResponse(`Backoff delay: ${event.delay_ms}ms`);
				} else if (event.type === "job") {
					appendResponse(`Job ${event.status}`);
				} else if (event.type === "tile" && event.status === "failed") {
					appendResponse(`FAILED z${event.z}/${event.x}/${event.y} -> ${event.error || "error"}`);
				}
			}
		}

		function setControls(state) {
			const active = state === "queued" || state === "running" || state === "paused";
			ui.downloadBtn.disabled = active;
			ui.pauseBtn.disabled = !active;
			ui.cancelBtn.disabled = !active;
			ui.pauseBtn.textContent = state === "paused" ? "Resume" : "Pause";
		}

		function stopPolling() {
			if (pollHandle) {
				clearInterval(pollHandle);
				pollHandle = null;
			}
		}

		async function pollJobStatus() {
			if (!activeJob || pollBusy) {
				return;
			}
			pollBusy = true;
			try {
				const url = `/scrapper/auto-download/status?job_id=${encodeURIComponent(activeJob.jobId)}&last_seq=${activeJob.lastSeq}`;
				const response = await fetch(url);
				if (!response.ok) {
					stopPolling();
					return;
				}
				const data = await response.json();
				activeJob.lastSeq = Number(data.last_seq) || activeJob.lastSeq;
				renderProgress(data);
				applyEvents(data.events);
				setControls(data.state);
				renderBackoffStatus(data.current_delay_ms || 0);

				if (data.state === "completed" || data.state === "cancelled" || data.state === "failed") {
					if (data.error) {
						appendResponse(data.error);
					}
					stopPolling();
					setState(data.state.charAt(0).toUpperCase() + data.state.slice(1), data.state);
					activeJob = null;
				} else if (data.state === "paused") {
					setState("Paused", "paused");
				} else {
					setState("Downloading...", "running");
				}
			} catch (error) {
				appendResponse(`Status error: ${error.message}`);
			} finally {
				pollBusy = false;
			}
		}

		function attachJob(jobId, lastSeq) {
			activeJob = { jobId, lastSeq: Number(lastSeq) || 0 };
			stopPolling();
			pollHandle = setInterval(pollJobStatus, POLL_INTERVAL_MS);
			pollJobStatus();
		}

		async function reattachActiveJob() {
			try {
				const response = await fetch("/scrapper/auto-download/active");
				if (!response.ok) {
					return;
				}
				const data = await response.json();
				if (data && data.job_id) {
					appendResponse(`Reattached to job ${data.job_id} (${data.state}).`);
					renderProgress(data);
					attachJob(data.job_id, data.last_seq || 0);
				}
			} catch (_error) {
				/* no active job to reattach */
			}
		}

		function populateZoomLevels() {
			for (let z = LIST_MIN_ZOOM; z <= MAX_ZOOM; z += 1) {
				const row = document.createElement("label");
				row.className = "zoom-item";

				const input = document.createElement("input");
				input.type = "checkbox";
				input.value = String(z);
				input.checked = z >= 8 && z <= 12;

				const text = document.createElement("span");
				text.textContent = `Z${z}`;

				row.appendChild(input);
				row.appendChild(text);
				ui.zoomList.appendChild(row);
			}
		}

		drawInteraction.on("drawstart", () => {
			drawSource.clear();
			selectedGeometry = null;
		});

		drawInteraction.on("drawend", (event) => {
			selectedGeometry = event.feature.getGeometry();
			drawInteraction.setActive(false);

			const extent = getSelectedExtent();
			ui.extentText.textContent = JSON.stringify(extent, null, 2);
		});

		ui.drawBtn.addEventListener("click", () => {
			drawSource.clear();
			selectedGeometry = null;
			ui.extentText.textContent = "Draw rectangle on map...";
			drawInteraction.setActive(true);
		});

		ui.clearBtn.addEventListener("click", () => {
			drawSource.clear();
			selectedGeometry = null;
			ui.extentText.textContent = "No area selected";
		});

		ui.selectAllZoom.addEventListener("click", () => {
			ui.zoomList.querySelectorAll("input[type='checkbox']").forEach((box) => {
				box.checked = true;
			});
		});

		ui.clearZoom.addEventListener("click", () => {
			ui.zoomList.querySelectorAll("input[type='checkbox']").forEach((box) => {
				box.checked = false;
			});
		});

		ui.downloadBtn.addEventListener("click", async () => {
			const extent = getSelectedExtent();
			if (!extent) {
				appendResponse("Select an area first.");
				return;
			}

			const zoomLevels = getSelectedZoomLevels();
			if (zoomLevels.length === 0) {
				appendResponse("Select at least one zoom level.");
				return;
			}

			const backoff = getBackoffConfig();
			ui.downloadBtn.disabled = true;
			renderBackoffStatus(0);
			appendResponse(`Starting job for zooms: ${zoomLevels.join(", ")}`);

			try {
				const response = await fetch("/scrapper/auto-download/start", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({
						extent,
						zoom_levels: zoomLevels,
						backoff: {
							enabled: backoff.enabled,
							window: backoff.window,
							threshold: backoff.threshold,
							step_ms: backoff.stepMs,
							max_delay_ms: backoff.maxDelayMs
						}
					})
				});

				if (!response.ok) {
					const err = await response.json().catch(() => ({}));
					appendResponse(err.detail || `Failed to start (${response.status}).`);
					ui.downloadBtn.disabled = false;
					return;
				}

				const data = await response.json();
				appendResponse(`Job started: ${data.total} tiles.`);
				attachJob(data.job_id, 0);
			} catch (error) {
				appendResponse(`Start error: ${error.message}`);
				ui.downloadBtn.disabled = false;
			}
		});

		ui.pauseBtn.addEventListener("click", async () => {
			if (!activeJob) {
				return;
			}
			const action = ui.pauseBtn.textContent === "Resume" ? "resume" : "pause";
			ui.pauseBtn.disabled = true;
			try {
				await fetch(`/scrapper/auto-download/${action}?job_id=${encodeURIComponent(activeJob.jobId)}`, { method: "POST" });
				await pollJobStatus();
			} catch (error) {
				appendResponse(`${action} error: ${error.message}`);
			}
		});

		ui.cancelBtn.addEventListener("click", async () => {
			if (!activeJob) {
				return;
			}
			ui.cancelBtn.disabled = true;
			try {
				await fetch(`/scrapper/auto-download/cancel?job_id=${encodeURIComponent(activeJob.jobId)}`, { method: "POST" });
				await pollJobStatus();
			} catch (error) {
				appendResponse(`Cancel error: ${error.message}`);
			}
		});

		populateZoomLevels();
		reattachActiveJob();
	</script>
</body>
</html>
